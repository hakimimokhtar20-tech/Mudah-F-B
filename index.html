const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),rm=n=>'RM'+(+n).toFixed(2),

{id:'a',c:'Makanan',n:'Nasi Lemak',p:6,e:'🍛'},{id:'b',c:'Makanan',n:'Mee Goreng',p:7,e:'🍜'},{id:'c',c:'Makanan',n:'Ayam Goreng',p:8,e:'🍗'},{id:'d',c:'Minuman',n:'Teh Ais',p:3,e:'🧋'},{id:'e',c:'Minuman',n:'Milo Ais',p:4,e:'🥤'},{id:'f',c:'Makanan',n:'Roti Canai',p:2.5,e:'🫓'}]};

if(pr){if(d>pr.d){beep(880,3);tst('Siap! 🍽️ Sedia dihidang')}else if(n>pr.n){beep(520,2);tst('Order baru masuk')}}pr={n,d}}
function fc(){if(!C.cats)C.cats=[...new Set(C.menu.map(m=>m.c).filter(Boolean))].map(n=>({n,e:'🍽️'}))}
function ld(){O=ls('o')||{};C=ls('c')||DEF;if(!C.pins)C.pins=DEF.pins;fc();chk();render()}
// ===== UI =====
const RV={c:['c','l'],o:['o'],k:['k'],a:['k','c','o','l','s']},RN={c:'Kasyer',o:'Ambil Order',k:'Dapur',a:'Owner (lihat semua)'},RI={c:'💵',o:'🛒',k:'👨‍🍳',a:'👑'};
const hd=(t,b,n)=>`<div class=hd>${n?'':'<a class=lo onclick="lo()">Keluar</a>'}${b?`<button class=bk onclick="bk()">←</button>`:''}<h1>${esc(C.shop)}</h1><small>${esc(t)}</small>${b?`<input class=sr placeholder="Nak makan apa?" value="${esc(S.q)}" oninput="S.q=this.value;mg()">`:''}</div>`;
const tb=(l,c)=>{const o=act(l);return`<button class="tb ${o?st(o):''}" onclick="${c||`pk('${l}')`}">${l}${o?'<br><small>'+rm(tot(o))+'</small>':''}</button>`};
const nav=()=>`<nav>${[['k','👨‍🍳','Dapur'],['c','💵','Kasyer'],['o','🏠',''],['l','📊','Laporan'],['s','⚙️','Setting']].filter(a=>RV[localStorage.fbrole].includes(a[0])).map(([v,i,t])=>`<a class="${v==S.v?'on':''} ${v=='o'?'hm':''}" onclick="S.v='${v}';S.sh=0;render(1)">${i}${t?`<small>${t}</small>`:''}</a>`).join('')}</nav>`;
function render(f){if(!f&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;const A=$('#app');
const R=localStorage.fbrole;if(!(R&&RV[R]&&C.pins[R]===localStorage.fbok)){A.innerHTML=hd(S.lr?'PIN '+RN[S.lr]:'Pilih peranan',0,1)+(S.lr?`<div class=bl style="text-align:center"><input class=sr id=pin type=password inputmode=numeric maxlength=4 oninput="lg(this.value)" style="text-align:center;font-size:30px;max-width:220px;margin:20px auto"><button class=bt onclick="S.lr=0;render(1)">← Tukar peranan</button></div>`:`<div class=g style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${Object.keys(RN).map(r=>`<button class=tb style="min-height:120px;font-size:16px" onclick="S.lr='${r}';render(1)"><span style="font-size:38px">${RI[r]}</span><br>${RN[r]}</button>`).join('')}</div>`);return}
if(!RV[R].includes(S.v))S.v=RV[R][0];
A.innerHTML=({o:vo,k:vk,c:vc,l:vl,s:vs}[S.v])()+nav()+(S.sh?sheet():'')+(S.imp?impUI():'')+(S.cash?cashUI():'');if(S.v=='o'&&S.t)mg();if(S.cash)bkc()}
function lo(){localStorage.fbrole='';S.lr=0;S.t=null;S.cart=[];S.sh=0;render(1)}
function lg(v){if(v.length==4){try{AC=AC||new AudioContext()}catch(e){}if(v===C.pins[S.lr]){localStorage.fbrole=S.lr;localStorage.fbok=v;S.v=RV[S.lr][0];S.lr=0;render(1)}else{tst('PIN salah');$('#pin').value=''}}}
// --- Ambil order
function vo(){if(!S.t){const bk=Object.values(O).filter(o=>o.l[0]=='B'&&!o.a).map(o=>o.l);
return hd('Pilih meja')+`<div class=g style="grid-template-columns:repeat(auto-fill,minmax(86px,1fr))">${[...Array(C.tables)].map((_,i)=>tb('Meja '+(i+1))).join('')}</div><div class=g style="padding-top:0;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${bk.map(l=>tb(l)).join('')}<button class=tb style="background:#111;color:#fff" onclick="nb()">+ Bungkus</button></div>`}
return hd(S.t+(S.cat?' › '+S.cat:''),1)+`<button id=bb class="bt bb" onclick="bk()"></button><div id=mg class=g></div>`+cb()}
function nb(){pk('Bungkus '+(Object.values(O).filter(o=>o.l[0]=='B'&&dt(o.ts)==dt(Date.now())).length+1))}
function pk(l){S.t=l;S.cart=[];S.q='';S.cat=null;render(1)}
function bk(){if(S.q)S.q='';else if(S.cat)S.cat=null;else{S.t=null;S.cart=[]}render(1)}
function oc(i){S.cat=cl()[i].n;render(1)}
const cat=m=>C.cats.some(c=>c.n==m.c)?m.c:'Lain-lain',cl=()=>{const a=C.cats.filter(c=>C.menu.some(m=>cat(m)==c.n));if(C.menu.some(m=>cat(m)=='Lain-lain')&&!a.some(c=>c.n=='Lain-lain'))a.push({n:'Lain-lain',e:'🍽️'});return a};
function mg(){const e=$('#mg');if(!e)return;const q=S.q.toLowerCase(),card=m=>{const c=S.cart.find(x=>x.m==m.id);return`<div class="cd ${m.h?'h':''}"><div class=im ${m.i?`style="background:url(${m.i}) center/cover"`:''}>${m.i?'':m.e||'🍽️'}</div><b>${esc(m.n)}</b><span class=pr>${rm(m.p)}</span>${c?`<i class=bq>${c.q}</i>`:''}<button class=pl ${m.h?'disabled':''} onclick="ad('${m.id}')">${m.h?'×':'+'}</button></div>`};let h;e.style.gridTemplateColumns='';
if(q)h=C.menu.filter(m=>m.n.toLowerCase().includes(q)).map(card).join('')||'<p>Tiada padanan</p>';
else if(S.cat)h=`<h2 style="grid-column:1/-1;margin:6px 0 -30px">${esc(S.cat)}</h2>`+C.menu.filter(m=>cat(m)==S.cat).map(card).join('');
else{e.style.gridTemplateColumns='repeat(auto-fill,minmax(200px,1fr))';h=cl().map((c,i)=>{const L=C.menu.filter(m=>cat(m)==c.n),n=S.cart.filter(x=>L.some(m=>m.id==x.m)).reduce((s,x)=>s+x.q,0);return`<div class="cd ct" onclick="oc(${i})"><div class=im ${c.i?`style="background:url(${c.i}) center/cover"`:''}>${c.i?'':c.e||'🍽️'}</div><b>${esc(c.n)}</b><span class=pr>${L.length} item</span>${n?`<i class=bq>${n}</i>`:''}</div>`}).join('')||'<p>Belum ada menu. Tambah di Setting.</p>'}
e.innerHTML=h;const b=$('#bb');if(b)b.textContent=q?'← Kosongkan carian':S.cat?'← Kembali ke kategori':'← Tukar meja'}
function cb(){const n=S.cart.reduce((s,c)=>s+c.q,0);return n?`<div id=cb class=cbar onclick="S.sh=1;render(1)">${n} item · ${rm(S.cart.reduce((s,c)=>s+c.q*c.p,0))} — Lihat & hantar ›</div>`:'<div id=cb></div>'}

function qc(i,d){S.cart[i].q+=d;if(S.cart[i].q<1)S.cart.splice(i,1);if(!S.cart.length)S.sh=0;render(1)}
function nc(i,x){const c=S.cart[i];c.nt=(c.nt?c.nt+', ':'')+x;render(1)}

function send(){const l=S.t;let o=act(l);const r={ts:Date.now(),d:0,i:S.cart.map(c=>({n:c.n,p:c.p,q:c.q,nt:c.nt||''}))};

<h2>Kategori</h2>${C.cats.map((c,i)=>`<div class=mc><div class=pv ${c.i?`style="background-image:url(${c.i})"`:''}>${c.i?'':c.e||'🍽️'}</div><div class=mf><label class="bt o" style="display:inline-block">⬆️ Upload<input type=file accept="image/*" hidden onchange="pic(${i},this.files[0],C.cats);this.value=''"></label>${c.i?`<button class="bt x" onclick="cu(${i},'i','')">🗑️ Delete</button>`:''}<input value="${esc(c.n)}" placeholder="Nama kategori" onchange="cn(${i},this.value)"><input value="${c.e||''}" placeholder="Emoji" style="width:70px" onchange="cu(${i},'e',this.value)"> <a class=ch onclick="cm(${i},-1)">⬆ Naik</a><a class=ch onclick="cm(${i},1)">⬇ Turun</a><a class=ch onclick="cd(${i})">Padam</a></div></div>`).join('')}<button class="bt o" onclick="C.cats.push({n:'Kategori baru',e:'🍽️'});sc();render(1)">+ Tambah kategori</button>

async function pic(i,f,a){if(!f)return;try{const b=await createImageBitmap(f),s=Math.min(b.width,b.height),cv=document.createElement('canvas');cv.width=cv.height=200;cv.getContext('2d').drawImage(b,(b.width-s)/2,(b.height-s)/2,s,s,0,0,200,200);(a||C.menu)[i].i=cv.toDataURL('image/jpeg',.65);sc();render(1)}catch(e){tst('Gagal muat gambar')}}

// --- Imbas menu (PDF/gambar) -> kategori automatik
const lsrc=u=>new Promise((r,j)=>{if(document.querySelector(`script[src="${u}"]`))return r();const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.append(s)}),
PJ='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',PW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',TJ='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js',
em=n=>([[/nasi/i,'🍛'],[/mee|mi |bihun|kuey/i,'🍜'],[/ayam|chicken/i,'🍗'],[/teh|kopi|milo|air|ais|jus|juice/i,'🥤'],[/roti/i,'🫓'],[/ikan|sotong|udang/i,'🐟'],[/burger/i,'🍔'],[/pizza/i,'🍕'],[/kek|cake|cendol/i,'🍰']].find(([r])=>r.test(n+' '))||[0,'🍽️'])[1];
function bin(cv){const x=cv.getContext('2d'),d=x.getImageData(0,0,cv.width,cv.height),p=d.data,N=p.length/4,g=new Uint8Array(N),h=new Array(256).fill(0);
for(let i=0;i<N;i++){g[i]=.299*p[i*4]+.587*p[i*4+1]+.114*p[i*4+2];h[g[i]]++}
let s=0,wb=0,sb=0,mx=0,th=128;for(let i=0;i<256;i++)s+=i*h[i];
for(let i=0;i<256;i++){wb+=h[i];if(!wb)continue;const wf=N-wb;if(!wf)break;sb+=i*h[i];const v=wb*wf*(sb/wb-(s-sb)/wf)**2;if(v>mx){mx=v;th=i}}
th*=.75;for(let i=0;i<N;i++){const v=g[i]>th?255:0;p[i*4]=p[i*4+1]=p[i*4+2]=v}x.putImageData(d,0,0);return cv}
async function prep(f){try{const b=await createImageBitmap(f),k=Math.min(2.5,2200/Math.max(b.width,b.height)),cv=document.createElement('canvas');cv.width=b.width*k;cv.height=b.height*k;cv.getContext('2d').drawImage(b,0,0,cv.width,cv.height);return bin(cv)}catch(e){return f}}
async function ocr(s){await lsrc(TJ);const w=await Tesseract.createWorker('eng');await w.setParameters({tessedit_pageseg_mode:'4'});const r=await w.recognize(s);await w.terminate();return r.data.text.split('\n')}
function parse(L){const out=[];let c='';
L=L.map(s=>{s=s.replace(/^[^A-Za-z0-9]+/,'').trim();const m=s.match(/^(\S{1,2})\s+(.{3,})$/);if(m&&(m[1].length<2||(m[2]===m[2].toUpperCase()&&/[A-Z]{3}/.test(m[2]))))s=m[2];return s}).filter(s=>/[a-z]/i.test(s));
const pm=s=>s.match(/^(.*?)[\s.:\-–…_]*(?:RM|rm|Rp\.?|IDR)?\s*(\d{1,3}(?:[.,]\d{3})+|\d{1,3}(?:[.,]\d{1,2})?)\s*([kK])?(?:\s*[^\w\s]|\s+\S)?\s*$/);
L.forEach((s,i)=>{const m=pm(s),th=m&&/^\d{1,3}([.,]\d{3})+$/.test(m[2]),p=m&&(th?+m[2].replace(/[.,]/g,''):+m[2].replace(',','.')*(m[3]?1000:1)),n=m&&m[1].replace(/^\d+[.)]\s*/,'').trim();
if(m&&p>0&&p<1e7&&/[a-z]/i.test(n)&&n.length>1)out.push({c,n:n===n.toUpperCase()?n.toLowerCase().replace(/\b[a-z]/g,x=>x.toUpperCase()):n,o:p,p,e:em(n),f:(m[3]||th)?1:0});
else if(s.length<35&&(s==s.toUpperCase()||(s.split(' ').length<4&&pm(L[i+1]||'')&&!/\d/.test(s))))c=s.replace(/[\s—–\-_|:;]+$/,'').toLowerCase().replace(/\b\w/g,x=>x.toUpperCase())});return out}
async function imp(FL){FL=[...(FL||[])];if(!FL.length)return;tst('Mengimbas menu… tunggu sekejap');let L=[];
try{for(const f of FL){if(f.type=='application/pdf'){await lsrc(PJ);pdfjsLib.GlobalWorkerOptions.workerSrc=PW;const pd=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
for(let i=1;i<=pd.numPages;i++){const pg=await pd.getPage(i),tc=await pg.getTextContent(),rw={};tc.items.forEach(x=>{const y=Math.round(x.transform[5]/4);(rw[y]=rw[y]||[]).push(x)});
const ln=Object.keys(rw).sort((a,b)=>b-a).map(y=>rw[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(x=>x.str).join(' ').trim()).filter(Boolean);
if(ln.join('').length>20)L.push(...ln);else{const v=pg.getViewport({scale:2.5}),cv=document.createElement('canvas');cv.width=v.width;cv.height=v.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise;L.push(...await ocr(bin(cv)))}}}
else L.push(...await ocr(await prep(f)))}
const r=parse(L);if(!r.length)return tst('Tiada menu dijumpai. Cuba fail yang lebih jelas');S.imp=r;const T=L.join(' '),fx=r.some(m=>m.f)||/\bRp\b|IDR|USD|SGD|S\$|US\$/i.test(T);S.fx={on:fx,r:fx&&!/USD|SGD|S\$|US\$/i.test(T)?0.00027:1};if(fx)cvt();render(1)}catch(e){tst('Gagal imbas. Pastikan ada internet')}}

addEventListener('paste',e=>{const F=[...(e.clipboardData?.files||[])].filter(x=>x.type.startsWith('image/'));if(F.length&&S.v=='s'&&localStorage.fbrole=='a')imp(F)});
